name: Create OCI VM

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

env:
  COMPARTMENT_ID: ${{ secrets.OCI_COMPARTMENT_ID }}
  IMAGE_ID: ${{ secrets.IMAGE_ID }}
  SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
  AD_NAME: ${{ secrets.AD_NAME }}

  OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}
  OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
  OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
  OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
  OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}

  OCI_CONFIG_FILE: /home/runner/.oci/config
  OCI_KEY_FILE: /home/runner/.oci/oci_api_key.pem

jobs:
  create-vm:
    runs-on: ubuntu-latest
    concurrency:
      group: coolify-vm-launch
      cancel-in-progress: false

    steps:
      - name: Install OCI CLI
        run: |
          set -Eeuo pipefail
          python3 -m pip install --user --upgrade oci-cli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure OCI CLI
        run: |
          set -Eeuo pipefail
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_CLI_KEY_CONTENT" | tr -d '\r' > "$OCI_KEY_FILE"
          chmod 600 "$OCI_KEY_FILE"

          cat > "$OCI_CONFIG_FILE" <<EOF
          [DEFAULT]
          user=$OCI_CLI_USER
          fingerprint=$OCI_CLI_FINGERPRINT
          tenancy=$OCI_CLI_TENANCY
          region=$OCI_CLI_REGION
          key_file=$OCI_KEY_FILE
          EOF
          chmod 600 "$OCI_CONFIG_FILE"

      - name: Check existing VM
        id: check_vm
        run: |
          set -Eeuo pipefail

          EXISTING_VM="$(
            oci --config-file "$OCI_CONFIG_FILE" \
              compute instance list \
              --compartment-id "$COMPARTMENT_ID" \
              --display-name "coolify-vm" \
              --region "$OCI_CLI_REGION" \
              --all \
              --query "data[?\"lifecycle-state\" != 'TERMINATED'] | [0].id" \
              --raw-output
          )"

          if [[ -n "$EXISTING_VM" && "$EXISTING_VM" != "null" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "instance_id=$EXISTING_VM" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create OCI VM
        id: create_vm
        if: steps.check_vm.outputs.exists != 'true'
        continue-on-error: true
        run: |
          set -Eeuo pipefail

          SSH_KEY_FILE="$RUNNER_TEMP/oci_ssh_key.pub"
          printf '%s\n' "${{ secrets.SSH_PUBLIC_KEY }}" | tr -d '\r' > "$SSH_KEY_FILE"

          OCI_OUTPUT="$(
            oci --config-file "$OCI_CONFIG_FILE" \
              compute instance launch \
              --compartment-id "$COMPARTMENT_ID" \
              --availability-domain "$AD_NAME" \
              --shape "VM.Standard.A1.Flex" \
              --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --subnet-id "$SUBNET_ID" \
              --image-id "$IMAGE_ID" \
              --ssh-authorized-keys-file "$SSH_KEY_FILE" \
              --assign-public-ip true \
              --display-name "coolify-vm" \
              --boot-volume-size-in-gbs 50 \
              --region "$OCI_CLI_REGION" \
              2>&1 || true
          )"

          echo "$OCI_OUTPUT"

          INSTANCE_ID="$(echo "$OCI_OUTPUT" | jq -r '.data.id // empty' 2>/dev/null || true)"
          LIFECYCLE_STATE="$(echo "$OCI_OUTPUT" | jq -r '.data["lifecycle-state"] // empty' 2>/dev/null || true)"

          if [[ "$LIFECYCLE_STATE" == "PROVISIONING" && -n "$INSTANCE_ID" ]]; then
            echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
            echo "launch_success=true" >> "$GITHUB_OUTPUT"
          elif echo "$OCI_OUTPUT" | grep -qi "Out of host capacity"; then
            echo "launch_success=false" >> "$GITHUB_OUTPUT"
            echo "reason=No capacity available right now, will retry in 5 min" >> "$GITHUB_OUTPUT"
            exit 0
          else
            echo "launch_success=false" >> "$GITHUB_OUTPUT"
            echo "reason=Launch failed for a reason other than capacity - check the log" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Confirm VM is running
        if: steps.create_vm.outputs.instance_id != ''
        run: |
          set -Eeuo pipefail
          INSTANCE_ID="${{ steps.create_vm.outputs.instance_id }}"

          for attempt in {1..6}; do
            STATE="$(
              oci --config-file "$OCI_CONFIG_FILE" \
                compute instance get \
                --instance-id "$INSTANCE_ID" \
                --region "$OCI_CLI_REGION" \
                --query 'data["lifecycle-state"]' \
                --raw-output 2>/dev/null || true
            )"
            echo "Attempt $attempt/6 - state: ${STATE:-unknown}"
            [[ "$STATE" == "RUNNING" ]] && break
            sleep 10
          done

      - name: Send Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1.15.4
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          title: >-
            ${{
              steps.check_vm.outputs.exists == 'true' && '✅ coolify-vm already running'
              || steps.create_vm.outputs.launch_success == 'true' && '🎉 coolify-vm created!'
              || steps.create_vm.outputs.reason != '' && steps.create_vm.outputs.reason || '⏳ coolify-vm not created'
            }}
          color: >-
            ${{
              (steps.check_vm.outputs.exists == 'true' || steps.create_vm.outputs.launch_success == 'true') && '0x28a745'
              || contains(steps.create_vm.outputs.reason, 'capacity') && '0xf0ad4e'
              || '0xdc3545'
            }}
          description: |
            Region: `${{ env.OCI_CLI_REGION }}` · AD: `${{ env.AD_NAME }}`
            Instance: `${{ steps.check_vm.outputs.instance_id || steps.create_vm.outputs.instance_id || 'none' }}`
